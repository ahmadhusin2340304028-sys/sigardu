name: sipeka
description: SIPEKA - Sistem Informasi Pelaporan Kinerja dan Anggaran Kegiatan (UI Prototype)
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.2
  # UI Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  file_picker: ^8.1.7
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  shared_preferences: ^2.5.5
  lottie: ^3.3.3
  url_launcher: ^6.2.5
  open_filex: ^4.7.0
  path_provider: ^2.1.3

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_sipeka.png"
